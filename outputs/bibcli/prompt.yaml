##########################################################################################################
# prompts for the structure file generation

structure_prompt: |
  "Given the following specifications in natural language:
  
  {{project_description}}
  
  List the names of all the respective modules with their methods of the target system needed to fulfill the tests.
  For each module, the description should contain all the necessary details for its implementation considering the project details described above.
  Create the file structure of the haskell project using following template in yaml:

  type: Project
  name: ...
  description: ...
  children:

    - type: Directory
      name: app
      description: ...
      children:

        - type: Module
          name: Main
          description: ...
          children:

            - type: Type
              name: ...
              description: ...
          
            - type: Method
              name: ...
              description: ...
              typeSignature: ...

    - type: Directory
      name: src
      description: ...
      children:

        - type: Module
          name: ...
          description: ...
          children:
        
            - type: Type
              name: ...
              description: ...
          
            - type: Method
              name: ...
              description: ...
              typeSignature: ...

  If needed, you can create new directory to manage modules.
  All type signatures must be enclosed in quotation marks.
  Do not create the final code.
  Avoid using natural language explanations."

structure_prompt_Re: |
  "Given the following specifications in natural language:
  
  {{project_description}}
  
  If needed, update the following structure file of haskell project which list the names of all the respective modules with their methods of the target system needed to fulfill the tests.
  
  {{current_structure}}

  If needed, you can create new directory to manage modules.
  All type signatures must be enclosed in quotation marks.
  Do not create the final code.
  Avoid using natural language explanations."

##########################################################################################################
# prompts for the acceptance test generation

acceptanceTest_prompt: |
  "Given the acceptance tests described below in natural language:
  
  {{acceptance_tests}}

  Generate the test code in Hspec to verify if the system is correct. 
  The test code must execute the main command of the system.
  The test code must be executable and self-contained, i.e., not to be completed by a developer.
  Represent each acceptance criterion as a separate test case or test function.
  Do not create the final code.
  Provide the code within a code block. Avoid using natural language explanations."

acceptanceTest_prompt_Re: |
  "Given the acceptance tests described below in natural language:
  
  {{acceptance_tests}}

  Update the test code in Hspec to verify if the system is correct. 
  The test code must execute the main command of the system.
  The test code must be executable and self-contained, i.e., not to be completed by a developer.
  Consider that the content of the current file is:

  {{current_testcode}}

  Represent each acceptance criterion as a separate test case or test function.
  Do not create the final code.
  Provide the code within a code block. Avoid using natural language explanations."

##########################################################################################################
# prompts for the module tests generation

moduleTest_prompt: |
  "Considering the existent modules and their methods as described here:
  
  {{structure_file}}

  Create unit tests in Hspec named {{module_name}}Spec for the module {{module_name}}.
  The test code must execute the publicly exposed functions and types.
  The test code must be executable and self-contained, i.e., not to be completed by a developer.
  Do not create the final code.
  Provide the code within a code block. Avoid using natural language explanations."

moduleTest_prompt_Re: |
  "Considering the existent modules and their methods as described here:
  
  {{structure_file}}

  Update unit tests in Hspec named {{module_name}}Spec for the module {{module_name}} given the current file below:
  
  {{current_testcode}}

  The test code must execute the publicly exposed functions and types.
  The test code must be executable and self-contained, i.e., not to be completed by a developer.
  Do not create the final code.
  Provide the code within a code block. Avoid using natural language explanations."

